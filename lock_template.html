h1{font:700 40px/1.1 Khand,sans-serif;margin:8px 0}.eb{font:600 12px Hind;letter-spacing:.1em;text-transform:uppercase;color:#737373;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
label{display:block;font:700 22px Khand,sans-serif;margin-top:20px}input{width:100%;min-height:60px;font:20px Hind;padding:0 16px;border:2px solid #171717;border-radius:10px;margin:8px 0 14px}input:focus{outline:3px solid #C1502E;outline-offset:2px}
.btn{width:100%;min-height:60px;font-size:16px!important;border:2px solid #171717;background:#171717;color:#fafafa;font:600 13px Hind;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.m{color:#737373;font-size:14px}#err{color:#A4161A;min-height:24px}footer{margin-top:40px;border-top:1px solid #e5e5e5;padding-top:16px;font-size:13px;color:#737373;letter-spacing:.1em;text-transform:uppercase}.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:#fff;border-top:2px solid #05668D;padding-bottom:env(safe-area-inset-bottom)}.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;font:600 11px Hind,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#525252;text-decoration:none;gap:2px}.tabs a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}.tabs a.on{color:#05668D;box-shadow:inset 0 3px 0 #05668D}body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}

<body><div class="w"><a class="eb home" href="../">Command Center</a><h1>{{TITLE}}</h1><p class="m">Private. Enter the dashboard password to unlock. It is remembered on this device until you tap Lock.</p>
<form id="f"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" placeholder="Enter password" required autofocus enterkeyhint="go"><button class="btn mw-hover">Unlock</button></form><div id="err" role="status"></div><footer><a href="https://maxweberman.com" style="color:inherit">Built by Max Weberman</a></footer><nav class="tabs" aria-label="Dashboard tabs"><a href="https://webermanapps.github.io/a-2sipntzsp385oxy3/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Apps Home</a><a href="../"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>Command</a><a href="../s/portfolio.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></svg>Portfolio</a><a href="../s/spending.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Spending</a></nav></div>
<script>
const S="{{SALT}}",C="{{CT}}",IT=600000,K='mwPortfolioKey';
const b2u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),u2b=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function open_(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']),d=b2u(C);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},k,d.slice(12));return new TextDecoder().decode(pt)}
async function show(h){if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r));document.open();document.write(h);document.close()}
async function derive(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b2u(S),iterations:IT},b,256)}
(async()=>{let s;try{s=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}if(s&&s.salt==S){try{show(await open_(b2u(s.k)));return}catch(e){localStorage.removeItem(K)}}})();
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const er=document.getElementById('err');er.textContent='Unlocking, one moment';
 try{const raw=await derive(document.getElementById('p').value);const h=await open_(raw);try{localStorage.setItem(K,JSON.stringify({salt:S,k:u2b(raw)}))}catch(x){}show(h)}catch(x){er.textContent='Wrong password. Try again.'}};
</script></body></html>
