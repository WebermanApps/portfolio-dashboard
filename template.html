<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="light"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta name="build" content="{{BUILD}}">
<title>Portfolio Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Khand:wght@600;700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand-tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--mw-foreground);font-family:var(--mw-font-body);line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--mw-border);padding-bottom:16px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mw-muted-text)}
h1,h2,h3{font-family:var(--mw-font-heading);font-weight:700;line-height:1.1;margin:0}
h1{font-size:40px;letter-spacing:-.01em}h2{font-size:24px;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:6px;height:18px;background:#C1502E;border-radius:2px}
h3{font-size:20px}
.status{margin:14px 0 0;color:#262626}.upd{font-size:13px;color:var(--mw-muted-text)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:2px solid var(--mw-primary);background:transparent;font:600 13px var(--mw-font-body);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--mw-primary);white-space:nowrap}
.btn:hover{background:var(--mw-primary);color:#fafafa}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{display:flex;gap:12px;border:1px solid var(--mw-border);border-radius:12px;padding:16px;background:#fff}
.card .ic{color:#C1502E;margin-top:2px}.card p{margin:4px 0 10px;color:#525252;font-size:15px}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;white-space:nowrap}
.done{background:#ecfdf5;color:#047857}.prog{background:#f5f5f5;color:#404040}.wait{background:#fff7ed;color:#b45309}
ul{list-style:none;margin:0;padding:0;border:1px solid var(--mw-border);border-radius:12px}
li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--mw-border);min-height:44px}
li:first-child{border-top:0}.rou li{justify-content:flex-start}.rou .ic{color:#C1502E}small{color:var(--mw-muted-text)}
.rec li:before{content:"";width:6px;height:6px;border-radius:50%;background:#a3a3a3;flex:none}.rec li{justify-content:flex-start}
.link{display:flex;gap:12px;align-items:center;border:1px solid var(--mw-border);border-radius:12px;padding:14px 16px;color:inherit;text-decoration:none;min-height:44px}
.cols{display:grid;grid-template-columns:1fr;gap:0 24px}
.board{display:block}
.report{border:1px solid var(--mw-border);border-left:4px solid #C1502E;border-radius:.6rem;padding:10px 14px;margin:16px 0 0}.report ul{list-style:none;border:0;margin:4px 0 0;padding:0}.report li{border:0;padding:2px 0;min-height:0;justify-content:flex-start}
.tile{color:inherit;text-decoration:none;min-height:44px}.tile .tb{flex:1;min-width:0}.tf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.lk{display:inline-flex;align-items:center;gap:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mw-muted-text)}.lk .ic{width:14px;height:14px;margin:0;color:inherit}a.tile:hover h3{text-decoration:underline}.tile.off{background:#fafafa;cursor:default}
footer{margin-top:40px;border-top:1px solid var(--mw-border);padding-top:16px;font-size:13px;color:var(--mw-muted-text);letter-spacing:.1em;text-transform:uppercase}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--mw-border);padding:8px 14px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.1);display:none}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr 1fr}h1{font-size:48px}}
@media(min-width:1100px){.grid{grid-template-columns:1fr 1fr 1fr}}
@media(min-width:1600px){
  .wrap{max-width:1520px;padding:28px 32px 56px}
  .grid{gap:16px}
  .cols{gap:0 28px}
  h2{font-size:26px;margin:32px 0 14px}
}
@media(min-width:2000px){
  .wrap{max-width:2000px;padding:40px 48px 72px}
  .grid{grid-template-columns:repeat(3,1fr);gap:20px}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:0 28px;align-items:start}
  .board .cols{display:contents}
  .board section h2{margin-top:32px}
  h1{font-size:56px}
  h2{font-size:28px}
  h3{font-size:22px}
  .card{padding:18px}
  .card p{font-size:16px}
}

/* TV / big screen (>=1600px): 20px body, 90vw content */
@media(min-width:1600px){.wrap{max-width:90vw!important;padding:40px 0 72px!important}body{font-size:20px}
h1{font-size:64px!important}h2{font-size:34px!important;margin:36px 0 16px!important}h3{font-size:26px!important}
.eyebrow,.upd,.lk,.pill,footer,.btn{font-size:16px!important}.card p,li,.report li,small{font-size:20px!important}.ic{width:28px;height:28px}
.btn{min-height:56px;padding:0 24px}}
@media(min-width:3000px){body{font-size:26px}h1{font-size:84px!important}h2{font-size:44px!important}h3{font-size:34px!important}.card p,li,.report li,small{font-size:26px!important}.eyebrow,.upd,.lk,.pill,footer,.btn{font-size:20px!important}}
</style></head><body><div class="wrap">
<header><div><div class="eyebrow">Command Center</div><h1>Portfolio</h1><div class="upd">Updated {{UPDATED}}</div></div>
</header>
{{REPORT}}<p class="status"><b>Status:</b> {{STATUS}}</p>
<h2>Dashboards</h2><div class="grid">{{LANES}}</div>
<div class="board">
<div class="cols"><section><h2>Decisions Max Owes</h2><ul>{{DEC}}</ul></section><section><h2>Open Items</h2><ul>{{OPEN}}</ul></section></div>
<div class="cols"><section><h2>Routines</h2><ul class="rou">{{ROU}}</ul></section><section><h2>Recent Work</h2><ul class="rec">{{REC}}</ul></section></div>
</div>
<h2>My Apps</h2><div class="grid">{{LNK}}</div>
<div style="display:flex;justify-content:center;margin-top:32px"><button class="btn mw-hover" id="share">{{SHARE}}Share</button></div><footer><a href="https://maxweberman.com" target="_blank" rel="noopener" style="color:inherit;display:inline-flex;align-items:center;min-height:44px">Built by Max Weberman</a></footer></div><div class="toast" id="t">Link Copied</div>
<script>document.getElementById('share').onclick=async()=>{const u=location.href;try{if(navigator.share){await navigator.share({title:'Portfolio Command Center',url:u});return}}catch(e){return}try{await navigator.clipboard.writeText(u)}catch(e){}const t=document.getElementById('t');t.style.display='block';setTimeout(()=>t.style.display='none',1600)}</script>
<script>/* cache-buster: if this copy is older than the live one, reload the fresh page */
(function(){var me=document.querySelector('meta[name=build]').content;if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistrations)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})});
fetch('./?nocache='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(h){var m=h.match(/name="build" content="(\d+)"/);if(m&&m[1]>me)location.replace('./?v='+m[1])}).catch(function(){})})();
</script></body></html>
